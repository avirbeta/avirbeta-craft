name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check 2D game syntax
        run: node --check game.js

      - name: Check 3D game syntax
        run: node --input-type=module --check - < 3d/game3d.js
